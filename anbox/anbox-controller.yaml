name: anbox-cloud
website: https://anbox-cloud.io
issues: https://bugs.launchpad.net/anbox-cloud
description: |
  The bundle provides a full deployment of Anbox Cloud with support for streaming.
series: jammy
applications:
  anbox-stream-gateway-lb:
    charm: haproxy
    channel: stable
    # The haproxy charm currently is not supported to jammy so deploy with focal
    series: focal
    num_units: 1
    expose: true
    options:
      default_mode: tcp
      peering_mode: active-active
      ssl_cert: SELFSIGNED
      ssl_key: SELFSIGNED
      services: |
        - service_name: app-anbox-stream-gateway
          service_host: "0.0.0.0"
          service_port: 8080
          service_options:
          - mode http
          server_options: check ssl verify none inter 2000 rise 2 fall 5 maxconn 4096
          crts: [DEFAULT]
        - service_name: app-anbox-cloud-dashboard
          service_host: "0.0.0.0"
          service_port: 8081
          service_options:
          - mode http
          server_options: check ssl verify none inter 2000 rise 2 fall 5 maxconn 4096
          crts: [DEFAULT]
        - service_name: api_http
          service_host: "0.0.0.0"
          service_port: 80
          service_options:
          - mode http
          - http-request redirect scheme https
        - service_name: api_https
          service_host: "0.0.0.0"
          service_port: 443
          service_options:
          - mode http
          - balance leastconn
          - acl path_start_api path_beg -i /1.0
          - acl path_start_ui path_beg -i /ui
          - use_backend app-anbox-stream-gateway if path_start_api
          - use_backend app-anbox-stream-gateway if path_start_ui
          - default_backend app-anbox-cloud-dashboard
          crts: [DEFAULT]

  anbox-stream-gateway:
    charm: 'anbox-stream-gateway'
    num_units: 3
    options:
      # By default the gateway is only accessible on a https endpoint with
      # self signed certificates. Setting `use_insecure_tls` will instruct
      # Anbox containers to still connect.
      # WARNING: For production environments the gateway should be only
      # available behind properly signed TLS certificates and the flag
      # `use_insecure_tls` set to false.
      use_insecure_tls: true
    channel: 1.23/stable
    constraints: cpu-cores=4 mem=4G root-disk=40G

  nats:
    charm: nats
    channel: stable
    num_units: 1
    constraints: cpu-cores=4 mem=4G root-disk=40G

  internal-ca:
    # The internal CA is used to give any service the possibility to obtain TLS
    # certificates and key for secure internal-only communication
    charm: easyrsa
    channel: stable
    num_units: 1

  etcd-ca:
    # The etcd CA is meant to be used for authenticated TLS communication with etcd
    charm: easyrsa
    channel: stable
    num_units: 1

  etcd:
    charm: etcd
    channel: stable
    constraints: cpu-cores=4 mem=4G root-disk=40G
    num_units: 1
    options:
      channel: 3.4/stable

relations:
- ['etcd:certificates', 'etcd-ca:client']
- ['nats:ca-client', 'internal-ca:client']
- ['anbox-stream-gateway:nats', 'nats:client']
- ['anbox-stream-gateway:api', 'anbox-stream-gateway-lb:reverseproxy']
- ['anbox-stream-gateway:certificates', 'internal-ca:client']
